<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页响应式测试台</title>
<style>
  :root {
    --color-primary: #6865a7;
    --color-primary-hover: #7774b3;
    --color-primary-soft: #eeedff;
    --color-text: #333333;
    --color-text-secondary: #666666;
    --color-text-muted: #999999;
    --color-border: #dddddd;
    --color-divider: #eaeaea;
    --color-page: #f2f3f5;
    --color-surface: #ffffff;
    --shadow-panel: 0 0 12px rgba(0, 0, 0, 0.08);
    --radius-panel: 16px;
    --radius-control: 6px;
  }

  * { box-sizing: border-box; }

  body {
    min-width: 360px;
    margin: 0;
    background: var(--color-page);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .test-toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 64px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--color-divider);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.03);
  }

  .toolbar-title { min-width: 0; }

  .toolbar-title strong {
    display: block;
    font-size: 16px;
    line-height: 24px;
    font-weight: 600;
  }

  .toolbar-title span {
    display: block;
    margin-top: 2px;
    color: var(--color-text-muted);
    font-size: 12px;
    line-height: 18px;
  }

  .viewport-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .viewport-control label {
    color: var(--color-text-secondary);
    font-size: 12px;
  }

  .viewport-control input {
    width: 88px;
    height: 32px;
    padding: 0 10px;
    border: 1px solid #bbbbbb;
    border-radius: var(--radius-control);
    outline: none;
    color: var(--color-text);
    background: var(--color-surface);
    font: inherit;
    font-variant-numeric: tabular-nums;
  }

  .viewport-control input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 2px var(--color-primary-soft);
  }

  .viewport-control button {
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--color-primary);
    border-radius: var(--radius-control);
    background: var(--color-primary);
    color: #ffffff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }

  .viewport-control button:hover { background: var(--color-primary-hover); }

  .preview-area {
    padding: 24px;
    overflow-x: auto;
  }

  .preview-shell {
    width: fit-content;
    min-width: 320px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: var(--radius-panel);
    background: var(--color-surface);
    box-shadow: var(--shadow-panel);
  }

  .preview-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    padding: 0 16px;
    border-bottom: 1px solid var(--color-divider);
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 18px;
  }

  .preview-meta strong {
    color: var(--color-primary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  iframe {
    display: block;
    border: 0;
    background: var(--color-surface);
  }

  @media (max-width: 640px) {
    .test-toolbar {
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
      padding: 12px 16px;
    }

    .viewport-control {
      width: 100%;
    }

    .viewport-control input { flex: 1; }
    .preview-area { padding: 16px 8px; }
  }
</style>
</head>
<body>
<header class="test-toolbar">
  <div class="toolbar-title">
    <strong>首页响应式测试台</strong>
    <span>基金分析设计规范 · 画布 #F2F3F5 · 主色 #6865A7 · 16px 面板圆角</span>
  </div>
  <form class="viewport-control" id="viewport-form">
    <label for="viewport-width">预览宽度</label>
    <input id="viewport-width" type="number" min="320" max="1920" step="1" inputmode="numeric" aria-label="预览宽度，单位像素">
    <button type="submit">应用</button>
  </form>
</header>
<main class="preview-area">
  <section class="preview-shell" aria-label="首页响应式预览">
    <div class="preview-meta">
      <span>模拟工作台第三栏</span>
      <strong id="label">加载中…</strong>
    </div>
    <iframe id="f" src="./index.html?v=7#/home" title="首页嵌入预览"></iframe>
  </section>
</main>
<script>
  var params = new URLSearchParams(location.search);
  var w = Number(params.get("w")) || 460;
  var input = document.getElementById("viewport-width");
  var label = document.getElementById("label");
  var frame = document.getElementById("f");

  function applyWidth(width) {
    w = Math.min(1920, Math.max(320, Number(width) || 460));
    input.value = w;
    label.textContent = w + " px";
    frame.style.width = w + "px";
    frame.style.height = "1900px";
  }

  document.getElementById("viewport-form").addEventListener("submit", function (event) {
    event.preventDefault();
    applyWidth(input.value);
    params.set("w", w);
    history.replaceState(null, "", "?" + params.toString());
  });

  applyWidth(w);
</script>
</body>
</html>
